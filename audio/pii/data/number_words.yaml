# Spoken-number, cue and UPI-handle vocabulary for audio/pii (docs/specs/audio.md 5.5, 5.6).
# Spellings are from the spec table and are UNVERIFIED against real ASR output: extend this file, not the code.
# All entries are passed through ``normalise_text`` when loaded, so case, NFKC form and punctuation do not matter.
digits:
  "0": [zero, oh, shunya, ज़ीरो, जीरो, शून्य, sonne, ಸೊನ್ನೆ, poojyam, பூஜ்யம், sunna, సున్నా, shunyo, শূন্য]
  "1": [one, ek, एक, ondu, ಒಂದು, onru, ஒன்று, okati, ఒకటి, এক]
  "2": [two, do, दो, eradu, ಎರಡು, irandu, இரண்டு, rendu, రెండు, dui, দুই]
  "3": [three, teen, तीन, mooru, ಮೂರು, moondru, மூன்று, moodu, మూడు, tin, তিন]
  "4": [four, char, chaar, चार, naalku, ನಾಲ್ಕು, naangu, நான்கு, naalugu, నాలుగు, চার]
  "5": [five, paanch, panch, पांच, पाँच, aidu, ಐದು, ainthu, ஐந்து, ఐదు, পাঁচ]
  "6": [six, chhe, chhah, che, chheh, छह, छः, छे, aaru, ಆರು, ஆறு, ఆరు, choy, ছয়]
  "7": [seven, saat, sat, सात, elu, ಏಳು, ezhu, ஏழு, edu, ఏడు, shat, সাত]
  "8": [eight, aath, ath, आठ, entu, ಎಂಟು, ettu, எட்டு, enimidi, ఎనిమిది, aat, আট]
  "9": [nine, nau, नौ, ombattu, ಒಂಬತ್ತು, onbathu, ஒன்பது, tommidi, తొమ్మిది, noy, নয়]
# Counted as number tokens (a run stays contiguous across them) but never expanded into digits.
compound: [das, दस, sau, सौ, hazaar, hazar, हज़ार, हजार, lakh, लाख, crore, करोड़]
repeat:
  double: 2
  dabal: 2
  डबल: 2
  triple: 3
  tripal: 3
  ट्रिपल: 3
plus: [plus, प्लस]
ninety: [ninety, nainty, नब्बे]
at_markers:            # token sequences that say "@"
  strong: [["at", "the", "rate", "of"], ["at", "the", "rate"], ["at", "d", "rate"], ["at", "rate"], ["एट", "द", "रेट"], ["एट", "दी", "रेट"], ["एट", "दि", "रेट"], ["attherate"], ["@"]]
  weak: [["at"], ["एट"], ["ऐट"]]
  partial: [["the", "rate", "of"], ["rate", "of"], ["द", "रेट"]]   # the leading "at" was lost: only with a known handle
  fuzzy: [["at", "the", "*", "of"], ["at", "*", "rate", "of"], ["at", "the", "rate", "*"]]   # one word mis-heard: known handle or a spelt name
handles: [oksbi, okhdfcbank, okicici, okaxis, ybl, ibl, axl, paytm, apl, upi, sbi, okhdfc, hdfcbank, icici, axisbank, fbl, ezetap, ikwik, airtel, jio, freecharge, kotak, yesbank, pnb, idfcbank, aubank, barodampay, ibkl, okbizaxis, hsbc, rbl, indus, cnrb, boi, uboi, postbank, ippb, hdfc, ओकेएसबीआई, ओकेएचडीएफसी, ओकेएचडीएफसीबैंक, ओकेआईसीआईसीआई, ओकेएक्सिस, वायबीएल, आईबीएल, एक्सएल, पेटीएम, एसबीआई, आईसीआईसीआई, एचडीएफसी, एक्सिसबैंक, एयरटेल, जियो]
